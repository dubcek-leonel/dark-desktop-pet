<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <title>Ajustes</title>
    <style>
      :root {
        --bg: #14141c;
        --panel: #1d1d29;
        --line: #33334a;
        --text: #ecebf5;
        --muted: #9a98b0;
        --accent: #8b5cf6;
        --ok: #4ade80;
        --err: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px 22px 28px;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
      }
      header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
      header img { width: 52px; height: 52px; }
      h1 { font-size: 20px; margin: 0; }
      header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        padding: 12px 14px 14px;
        margin: 0 0 14px;
      }
      legend { padding: 0 6px; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
      label { display: block; margin: 10px 0 4px; font-size: 13px; }
      label:first-of-type { margin-top: 2px; }
      input[type='text'], input[type='password'], input[type='number'], select, textarea {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      textarea { resize: vertical; min-height: 60px; }
      input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > input, .row > select { flex: 1; }
      .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .hint a { color: var(--accent); }
      button {
        border: 1px solid var(--line);
        background: #262636;
        color: var(--text);
        border-radius: 8px;
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; width: 100%; padding: 10px; }
      .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
      .check label { margin: 0; }
      #status, #probe { min-height: 18px; font-size: 13px; margin-top: 8px; }
      .ok { color: var(--ok); }
      .err { color: var(--err); }
      .range { display: flex; gap: 10px; align-items: center; }
      .range input { flex: 1; }
      .range output { width: 44px; text-align: right; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <img id="avatar" alt="" />
      <div>
        <h1 id="title">Ajustes</h1>
        <p>Los cambios se aplican al guardar.</p>
      </div>
    </header>

    <form id="form">
      <fieldset>
        <legend>Inteligencia artificial</legend>
        <label for="provider">Proveedor</label>
        <select id="provider"></select>

        <div id="keyBlock">
          <label for="apiKey">API key</label>
          <input type="password" id="apiKey" autocomplete="off" spellcheck="false" />
          <div class="hint" id="keyHint"></div>
        </div>

        <label for="model">Modelo</label>
        <div class="row">
          <input type="text" id="model" list="models" spellcheck="false" />
          <button type="button" id="loadModels">Cargar lista</button>
        </div>
        <datalist id="models"></datalist>

        <label for="baseUrl">URL del servicio</label>
        <input type="text" id="baseUrl" spellcheck="false" />

        <div class="row" style="margin-top: 10px">
          <button type="button" id="test">Probar conexión</button>
        </div>
        <div id="probe"></div>
      </fieldset>

      <fieldset>
        <legend>Personaje</legend>
        <label for="name">Nombre</label>
        <input type="text" id="name" maxlength="40" />
        <label for="personality">Personalidad</label>
        <textarea id="personality" maxlength="1000"></textarea>
        <div class="hint">Ejemplo: sarcástico y algo flojo, pero en el fondo buena onda.</div>
      </fieldset>

      <fieldset>
        <legend>Comportamiento</legend>
        <label for="scale">Tamaño</label>
        <div class="range">
          <input type="range" id="scale" min="0.5" max="2" step="0.1" />
          <output id="scaleOut"></output>
        </div>
        <label for="sleep">Se duerme después de (minutos sin tocarlo)</label>
        <input type="number" id="sleep" min="1" max="120" />
        <div class="check">
          <input type="checkbox" id="startup" />
          <label for="startup">Iniciar con Windows (en la versión instalada)</label>
        </div>
      </fieldset>

      <button type="submit" class="primary">Guardar</button>
      <div id="status"></div>
    </form>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>

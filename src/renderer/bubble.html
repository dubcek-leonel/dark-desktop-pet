<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Dark — chat</title>
    <style>
      :root {
        --ink: #17141f;
        --paper: #fffdf5;
        --muted: #6d6879;
        --accent: #7b3fe4;
        --err: #b3261e;
      }
      html, body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
      }
      #wrap {
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 14px;
      }
      .bubble {
        position: relative;
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 18px;
        padding: 10px 12px 8px;
        box-shadow: 3px 3px 0 var(--ink);
      }
      .bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -14px;
        width: 18px;
        height: 18px;
        background: var(--paper);
        border-right: 3px solid var(--ink);
        border-bottom: 3px solid var(--ink);
        transform: translateX(-50%) rotate(45deg);
        box-shadow: 3px 3px 0 var(--ink);
      }
      #close {
        position: absolute;
        top: 4px;
        right: 6px;
        border: 0;
        background: none;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        color: var(--muted);
      }
      #close:hover { color: var(--ink); }
      #question {
        font-size: 12px;
        color: var(--muted);
        margin: 0 18px 4px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #question:empty { display: none; }
      #answer {
        font-size: 14.5px;
        line-height: 1.38;
        max-height: 210px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        margin-right: 12px;
      }
      #answer:empty { display: none; }
      #answer.error { color: var(--err); }
      .dots span {
        display: inline-block;
        animation: blink 1.2s infinite;
        font-weight: 700;
      }
      .dots span:nth-child(2) { animation-delay: 0.2s; }
      .dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 80%, 100% { opacity: 0.2 } 40% { opacity: 1 } }
      form {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        border: 2px solid var(--ink);
        border-radius: 10px;
        padding: 6px 9px;
        font: inherit;
        font-size: 13.5px;
        background: #fff;
        outline: none;
      }
      input:focus { border-color: var(--accent); }
      button[type='submit'] {
        border: 2px solid var(--ink);
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        padding: 0 11px;
        cursor: pointer;
      }
      button[type='submit']:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div class="bubble">
        <button id="close" title="Cerrar (Esc)" aria-label="Cerrar">✕</button>
        <div id="question"></div>
        <div id="answer"></div>
        <form id="form">
          <input id="input" autocomplete="off" placeholder="Escríbele algo…" maxlength="4000" />
          <button type="submit" id="send">➤</button>
        </form>
      </div>
    </div>
    <script type="module" src="./bubble.ts"></script>
  </body>
</html>
